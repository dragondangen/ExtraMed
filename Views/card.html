<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Экстренная медицинская карточка — ExtraMed</title>
  <link rel="stylesheet" href="/site.css">
  <script src="/reader.js" type="module"></script>
</head>
<body class="reader-page">
  <header class="topbar"><div class="shell topbar-content"><a class="brand" href="/"><span class="brand-mark icon icon-cross" aria-hidden="true"></span>Extra<span>Med</span></a></div></header>
  <main class="reader-shell">
    <h1>Экстренная медицинская карточка</h1>
    <p id="card-status" class="notice" role="status">Загружаем сведения пациента…</p>
    <article id="patient-card" hidden>
      <div class="patient-summary panel">
        <div class="photo-placeholder"><span class="icon icon-person" aria-hidden="true"></span><img id="patient-photo" alt="Фото пациента" hidden></div>
        <div><h2 id="patient-name"></h2><p id="patient-meta"></p></div>
      </div>
      <section class="critical panel"><h2><span aria-hidden="true">!</span> Аллергические реакции</h2><p id="patient-allergies"></p></section>
      <section class="panel medical-card">
        <h2>Постоянно принимаемые лекарства</h2><p id="patient-medications"></p>
        <h2>Заболевания, операции и хронические патологии</h2><p id="patient-history"></p>
        <h2>Беременность</h2><p id="patient-pregnancy"></p>
      </section>
      <section class="panel medical-card">
        <h2>Паспорт и полис ОМС</h2>
        <p id="document-status" role="status"></p>
        <a id="staff-sign-in" class="button outline" hidden>Войти как сотрудник</a>
        <dl id="document-values" hidden>
          <dt>Паспорт гражданина РФ</dt><dd id="patient-passport"></dd>
          <dt>Полис ОМС</dt><dd id="patient-policy"></dd>
        </dl>
        <button type="button" class="button outline" id="staff-sign-out" hidden>Выйти</button>
      </section>
      <p class="updated" id="updated"></p>
    </article>
  </main>
</body>
</html>
